name: Atelier
description: Install Nix and optionally reclaim disk space for building flake outputs

inputs:
  system:
    description: Nix system to build for
    required: true
  reclaim:
    description: Reclaim runner disk space for large builds
    default: "true"
  install-command:
    description: Shell command that installs Nix; empty uses the built-in installer
    default: ""
  pre-install:
    description: Shell command run as the first step, before Nix is installed; fires whichever installer is used
    default: ""
  post-install:
    description: Shell command run as the last step, after Nix is installed and configured
    default: ""
  extra-conf:
    description: Extra nix.conf lines appended after the required settings
    default: ""
  rules:
    description: Atelier rule file whose substituters and trusted-public-keys are injected into nix.conf
    default: atelier.toml
  post-build-hook:
    description: Install the spooling post-build hook and name it in nix.conf
    default: "false"

runs:
  using: composite
  steps:
    - name: Export Atelier Root
      # publish the action checkout's repo root so later workflow steps can
      # invoke files shipped with atelier (the runner downloads the whole
      # repository for a subdirectory action)
      shell: bash
      run: | # zizmor: ignore[github-env] value is the runner-provided action path, not consumer input
        # a failed strip must collapse to the empty value the push step guards
        root="${GITHUB_ACTION_PATH%/.github/actions/atelier}"
        if [ ! -f "${root}/src/atelier/stream.py" ]; then
          echo "::warning::Atelier root not found under ${GITHUB_ACTION_PATH}, streaming disabled"
          root=""
        fi
        printf 'ATELIER_ROOT=%s\n' "${root}" >> "$GITHUB_ENV"

    - name: Pre Install Hook
      # consumer-supplied command, passed via env (not interpolated into the
      # script body) so it cannot break out of the run. it is the first consumer-visible step and
      # carries no install-command guard, so it fires before the built-in or a
      # custom installer alike, on a fresh runner before disk reclaim
      if: ${{ inputs.pre-install != '' }}
      shell: bash
      env:
        PRE_INSTALL: ${{ inputs.pre-install }}
      run: |
        set -euo pipefail
        bash -c "${PRE_INSTALL}"

    - name: Reclaim Disk Space (Linux)
      if: ${{ inputs.reclaim == 'true' && runner.os == 'Linux' }}
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: rampage
        witness-carnage: true

    - name: Reclaim Disk Space (Darwin)
      if: ${{ inputs.reclaim == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        echo "::group::Disk space (before)"
        sudo df -h
        echo "::endgroup::"

        echo "::group::Disable mds"
        sudo mdutil -i off -a || echo "mdutil failed"
        sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.metadata.mds.plist \
          || echo "launchctl unload failed"
        echo "::endgroup::"

        echo "Background space expansion started, /nix will grow as space becomes available"
        sudo rm -rf \
          /Applications/Xcode_* \
          /Library/Developer/CoreSimulator \
          /Library/Frameworks \
          /Users/runner/.dotnet \
          /Users/runner/.rustup \
          /Users/runner/Library/Android \
          /Users/runner/Library/Caches \
          /Users/runner/Library/Developer/CoreSimulator \
          /Users/runner/hostedtoolcache &

    - name: Compute Nix Configuration
      id: conf
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
        SANDBOX: ${{ runner.os == 'macOS' && 'relaxed' || 'true' }}
        EXTRA_CONF: ${{ inputs.extra-conf }}
        RULES: ${{ inputs.rules }}
        POST_BUILD_HOOK: ${{ inputs.post-build-hook }}
      run: |
        set -euo pipefail
        # the nix.conf lines that apply whichever installer ran, so a custom
        # installer gets the same build settings as the built-in one. the secret
        # access-tokens line is added directly by each consumer below, never
        # through this output. build-dir in /nix works around nothing-but-nix
        # issue 18.
        #
        # the pull cache is read from the rule file (the same substituters that
        # drive discovery's cache-status check) and injected here
        subs=""
        keys=""
        if [ -f "${RULES}" ]; then
          parsed="$(python3 -c 'import sys, tomllib; d = tomllib.load(open(sys.argv[1], "rb")); print(" ".join(d.get("substituters") or [])); print(" ".join(d.get("trusted-public-keys") or []))' "${RULES}" 2>/dev/null || true)"
          subs="$(printf '%s' "${parsed}" | sed -n '1p')"
          keys="$(printf '%s' "${parsed}" | sed -n '2p')"
        fi
        {
          echo 'conf<<__ATELIER_NIX_CONF__'
          echo "accept-flake-config = true"
          echo "experimental-features = nix-command flakes"
          echo "build-dir = /nix/build"
          echo "fsync-metadata = false"
          echo "http3 = true"
          echo "system = ${SYSTEM}"
          echo "sandbox = ${SANDBOX}"
          if [ -n "${subs}" ]; then
            echo "extra-substituters = ${subs}"
          fi
          if [ -n "${keys}" ]; then
            echo "extra-trusted-public-keys = ${keys}"
          fi
          # named before extra-conf so a consumer override wins (last wins)
          if [ "${POST_BUILD_HOOK}" = "true" ]; then
            echo "post-build-hook = /nix/var/atelier/hook.sh"
          fi
          # explicit if, not `[ -n ] && printf`, so an empty value does not trip
          # set -e on the trailing conditional
          if [ -n "${EXTRA_CONF}" ]; then
            printf '%s\n' "${EXTRA_CONF}"
          fi
          echo '__ATELIER_NIX_CONF__'
        } >> "$GITHUB_OUTPUT"

    - name: Install Nix
      if: ${{ inputs.install-command == '' }}
      uses: nixos/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      with:
        # authenticate github api calls so flake fetches (github: refs, the
        # nixpkgs registry, the niks3 install) get the 5000/hr token limit
        # instead of the 60/hr unauthenticated one shared across runner ips,
        # which 403s intermittently; the installer's own github-token does not
        # configure this for later nix invocations
        extra-conf: |
          access-tokens = github.com=${{ github.token }}
          ${{ steps.conf.outputs.conf }}

    - name: Install Nix (Custom)
      if: ${{ inputs.install-command != '' }}
      shell: bash
      env:
        # the consumer-supplied installer command, passed via env (not
        # interpolated into the script body) so it cannot break out of the run
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        set -euo pipefail
        bash -c "${INSTALL_COMMAND}"

    - name: Configure Nix (Custom)
      if: ${{ inputs.install-command != '' }}
      shell: bash
      env:
        # access-tokens injected here, not via the shared step output, so the
        # token never lands in a step output; see the built-in install step
        GH_TOKEN: ${{ github.token }}
        NIX_CONF: ${{ steps.conf.outputs.conf }}
      run: |
        set -euo pipefail
        # a custom installer wrote its own /etc/nix/nix.conf, so append atelier's
        # required settings and reload the daemon for the build-time ones
        # (sandbox, system, build-dir) to take effect. trust the runner user too:
        # the built-in installer adds it to trusted-users, but a custom installer
        # may not, and without it nix ignores the flake's substituters and keys
        # (extra-, so the installer's existing trusted-users list is kept)
        {
          echo "access-tokens = github.com=${GH_TOKEN}"
          echo "extra-trusted-users = $(id -un)"
          printf '%s\n' "${NIX_CONF}"
        } | sudo tee -a /etc/nix/nix.conf >/dev/null
        if [ "${RUNNER_OS}" = "macOS" ]; then
          sudo launchctl kickstart -k system/org.nixos.nix-daemon \
            || echo "::warning::Could not reload nix-daemon, build settings may not apply"
        else
          sudo systemctl restart nix-daemon \
            || echo "::warning::Could not restart nix-daemon, build settings may not apply"
        fi

    - name: Create Build Dir
      shell: bash
      run: sudo mkdir -p /nix/build

    - name: Install Post Build Hook
      # after the installer because /nix does not exist on macos before it
      # creates the volume. no build can run between daemon start and this
      # step (the steps in between invoke no nix commands and the consumer
      # post-install hook runs later), so the hook path named in nix.conf
      # always resolves by the time a build finishes
      if: ${{ inputs.post-build-hook == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # explicit modes, sudo inherits the caller's umask
        # install -m /dev/null also truncates a spool surviving on a
        # persistent /nix so old jobs' paths are not replayed
        # the paths must match hook.sh and stream.py's ATELIER_SPOOL default
        sudo mkdir -p -m 0755 /nix/var/atelier
        sudo install -m 0755 "${GITHUB_ACTION_PATH}/hook.sh" /nix/var/atelier/hook.sh
        sudo install -m 0644 /dev/null /nix/var/atelier/spool

    - name: Report Disk Space (Darwin)
      if: ${{ inputs.reclaim == 'true' && runner.os == 'macOS' }}
      uses: srz-zumix/post-run-action@42756f7452b9439d0365b7e087b2c364f54209c6 # v3.0.2
      with:
        shell: bash -e {0}
        post-run: |
          echo "::group::Disk space (after)"
          sudo df -h
          echo "::endgroup::"

    - name: Post Install Hook
      # last step, so nix is installed and configured (any installer) and ready
      # to use; env-passed like the pre-install hook for the same reason
      if: ${{ inputs.post-install != '' }}
      shell: bash
      env:
        POST_INSTALL: ${{ inputs.post-install }}
      run: |
        set -euo pipefail
        bash -c "${POST_INSTALL}"
